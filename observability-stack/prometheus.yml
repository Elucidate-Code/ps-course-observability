global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector's own self-telemetry (queue size, send-failures) — not application
  # metrics. This is what backs the pipeline-health beat in M5C4.
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]